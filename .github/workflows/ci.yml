name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spmb
          POSTGRES_PASSWORD: spmb_dev
          POSTGRES_DB: spmb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spmb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://spmb:spmb_dev@localhost:5432/spmb_test
      # Dummy: hanya untuk membangun tipe dan build. Test memakai nilai dari tests/setup-env.ts.
      DATABASE_URL: postgresql://spmb:spmb_dev@localhost:5432/spmb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
