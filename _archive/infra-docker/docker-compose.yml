# Produksi. Database = Supabase (env backend). HTTPS/Let's Encrypt dipasang saat deploy (M9).
name: spmb

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/spmb.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public:/var/www/html/public:ro
    depends_on: [backend, frontend]
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      target: prod
    env_file: ../backend/.env
    volumes:
      - backend_public:/var/www/html/public
      - backend_storage:/var/www/html/storage
    restart: unless-stopped

  queue:
    build:
      context: ../backend
      target: prod
    command: php artisan queue:work --tries=5
    env_file: ../backend/.env
    volumes:
      - backend_storage:/var/www/html/storage
    restart: unless-stopped

  scheduler:
    build:
      context: ../backend
      target: prod
    command: php artisan schedule:work
    env_file: ../backend/.env
    volumes:
      - backend_storage:/var/www/html/storage
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    env_file: ../frontend/.env
    restart: unless-stopped

  ocr:
    build:
      context: ../ocr-service
    env_file: ../ocr-service/.env
    restart: unless-stopped

volumes:
  backend_public:
  backend_storage:
