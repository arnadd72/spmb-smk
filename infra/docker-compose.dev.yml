# Dev: Postgres lokal untuk dev dan test. Produksi memakai Supabase (lihat docker-compose.yml).
name: spmb-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spmb
      POSTGRES_PASSWORD: spmb_dev
      POSTGRES_DB: spmb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spmb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: spmb
      DB_USERNAME: spmb
      DB_PASSWORD: spmb_dev
      DB_SSLMODE: prefer
      OCR_SERVICE_URL: http://ocr:8001
    volumes:
      - ../backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    command: php artisan queue:work --tries=1
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: spmb
      DB_USERNAME: spmb
      DB_PASSWORD: spmb_dev
      DB_SSLMODE: prefer
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: /api/v1
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"

  ocr:
    build:
      context: ../ocr-service
    env_file:
      - path: ../ocr-service/.env
        required: false
    ports:
      - "8001:8001"

volumes:
  pgdata:
